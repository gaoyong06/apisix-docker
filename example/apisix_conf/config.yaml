apisix:
  node_listen: 9080              # APISIX listening port
  enable_ipv6: false

  enable_control: true
  control:
    ip: "0.0.0.0"
    port: 9092

deployment:
  admin:
    allow_admin:               # https://nginx.org/en/docs/http/ngx_http_access_module.html#allow
      - 0.0.0.0/0              # We need to restrict ip access rules for security. 0.0.0.0/0 is for test.

    admin_key:
      - name: "admin"
        key: xinyuan_tech_apisix_admin_key_2025_secure  # 请修改为更安全的 key
        role: admin                 # admin: manage all configuration data

      - name: "viewer"
        key: xinyuan_tech_apisix_viewer_key_2025_secure  # 请修改为更安全的 key
        role: viewer

  etcd:
    host:                           # it's possible to define multiple etcd hosts addresses of the same etcd cluster.
      - "http://etcd:2379"          # multiple etcd address
    prefix: "/apisix"               # apisix configurations prefix
    timeout: 30                     # 30 seconds

plugin_attr:
  prometheus:
    export_addr:
      ip: "0.0.0.0"
      port: 9091

# 外部插件配置（Go Plugin Runner）
ext-plugin:
  # Go Plugin Runner 命令路径
  # 注意：插件二进制文件通过 docker-compose.dev.yml 挂载到容器中
  # bin 目录挂载到 /usr/local/bin/go-runner，所以实际路径是 /usr/local/bin/go-runner/go-runner
  cmd: ["/usr/local/bin/go-runner/go-runner", "run"]
