version: "3.8"

# 开发环境 Docker Compose 配置
# 只包含基础设施：APISIX、etcd、RocketMQ
# MySQL、Redis、微服务和插件在本地开发运行

services:
  # APISIX 网关
  apisix:
    image: apache/apisix:3.14.1-debian
    restart: always
    volumes:
      # 配置文件挂载（修改后重启容器即可生效）
      - ./apisix_conf/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      # 插件二进制和配置文件挂载（本地构建后挂载）
      # 注意：挂载 bin/go-runner 目录到 /usr/local/bin/go-runner，可执行文件路径为 /usr/local/bin/go-runner/go-runner
      # 配置文件挂载到独立位置，避免与 bin 目录挂载冲突
      - ../../apisix-devshare-plugin-runner/bin/go-runner:/usr/local/bin/go-runner:ro
      - ../../apisix-devshare-plugin-runner/configs:/usr/local/bin/go-runner-configs:ro
    ports:
      - "9080:9080"   # HTTP 端口
      - "9443:9443"   # HTTPS 端口
      - "9180:9180"   # Admin API 端口
      - "9091:9091"   # Prometheus 端口
      - "9092:9092"   # Control API 端口
    depends_on:
      - etcd
    networks:
      - dev-network
    environment:
      - APISIX_STAND_ALONE=false
    # 允许访问宿主机服务（用于插件调用本地微服务）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9080/apisix/admin/routes", "-H", "X-API-KEY: xinyuan_tech_apisix_admin_key_2025_secure"]
      interval: 10s
      timeout: 5s
      retries: 3

  # etcd 配置中心
  etcd:
    image: bitnamilegacy/etcd:3.5.11
    restart: always
    volumes:
      - etcd_data:/bitnami/etcd
    environment:
      ETCD_ENABLE_V2: "true"
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: "http://etcd:2379"
      ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
    ports:
      - "2379:2379"
    networks:
      - dev-network
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # RocketMQ NameServer
  rocketmq-namesrv:
    container_name: rmqnamesrv
    image: apache/rocketmq:5.2.0
    restart: always
    ports:
      - "9876:9876"
    networks:
      - dev-network
    environment:
      # 设置 RocketMQ 主目录
      - ROCKETMQ_HOME=/home/rocketmq/rocketmq-5.2.0
      # 设置 JVM 参数，避免网络接口获取问题
      - JAVA_OPT_EXT=-server -Xms512m -Xmx512m -Xmn256m -Djava.net.preferIPv4Stack=true
    command: sh mqnamesrv
    healthcheck:
      test: ["CMD", "sh", "-c", "netstat -an | grep 9876 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # RocketMQ Broker
  rocketmq-broker:
    container_name: rmqbroker
    image: apache/rocketmq:5.2.0
    restart: always
    ports:
      - "10911:10911"  # Broker 端口
      - "10909:10909"  # VIP 端口
    depends_on:
      - rocketmq-namesrv
    networks:
      - dev-network
    environment:
      - NAMESRV_ADDR=rocketmq-namesrv:9876
      - JAVA_OPT_EXT=-server -Xms512m -Xmx512m -Xmn256m -Djava.net.preferIPv4Stack=true
    volumes:
      # 挂载 RocketMQ 配置文件
      - ../../devops-tools/configs/rocketmq/broker.conf:/home/rocketmq/rocketmq-5.2.0/conf/broker.conf:ro
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/rocketmq-5.2.0/conf/broker.conf
    healthcheck:
      test: ["CMD", "sh", "-c", "netstat -an | grep 10911 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RocketMQ 控制台（Dashboard）
  rocketmq-console:
    container_name: rmqconsole
    image: styletang/rocketmq-console-ng:latest
    restart: always
    ports:
      - "8080:8080"  # 控制台 Web 端口
    depends_on:
      - rocketmq-namesrv
    networks:
      - dev-network
    environment:
      # 设置 NameServer 地址（使用服务名，在同一网络中）
      - JAVA_OPTS=-Drocketmq.namesrv.addr=rocketmq-namesrv:9876

networks:
  dev-network:
    driver: bridge

volumes:
  etcd_data:
    driver: local

# 注意：
# - MySQL 和 Redis 在本地运行，不在 Docker 中
# - 微服务和插件在本地开发运行
# - 使用 devops-tools 的 make restart-all 管理所有微服务
